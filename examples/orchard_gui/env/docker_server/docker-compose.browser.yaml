# ==========================================================================
# Browser Environment Server – Docker Compose
#
# Usage (from slime-private root):
#   docker compose -f examples/orchard_gui/env/docker_server/docker-compose.browser.yaml up --build
#
# Single server:  http://localhost:8100
# Multiple servers: http://localhost:8100, http://localhost:8101, ...
#
# Point the trainer at these via remote.server_url in examples/orchard_gui/env/config.yaml:
#   # Single server
#   remote: {server_url: "http://browser-env-0:8100"}
#   # Multiple servers (comma-separated)
#   remote: {server_url: "http://browser-env-0:8100,http://browser-env-1:8100"}
# ==========================================================================

# ------------------------------------------------------------------
# Shared build/runtime config via YAML anchor
# ------------------------------------------------------------------
x-browser-env: &browser-env-base
  build:
    context: ../../../..       # slime-private root (env/docker_server -> env -> browser -> examples -> root)
    dockerfile: examples/orchard_gui/env/docker_server/Dockerfile.browser
  environment:
    - NUM_BROWSER_ENVS=4
    - BROWSER_ENV_IDLE_TIMEOUT_SECS=600
  # Chromium needs shared memory > default 64MB
  shm_size: "2g"
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s

services:
  # ---- First browser env server (always enabled) ----
  browser-env-0:
    <<: *browser-env-base
    container_name: browser-env-0
    ports:
      - "8100:8100"

  # ---- Additional servers: uncomment to scale out ----
  browser-env-1:
    <<: *browser-env-base
    container_name: browser-env-1
    ports:
      - "8101:8100"

  # browser-env-2:
  #   <<: *browser-env-base
  #   container_name: browser-env-2
  #   ports:
  #     - "8102:8100"

  # Example: connect the slime training container to the same network
  # Uncomment and adjust if your slime container is managed by this compose file.
  #
  # slime:
  #   image: slime:latest
  #   container_name: slime
  #   # set remote.server_url: "http://browser-env-0:8100,http://browser-env-1:8100" in env/config.yaml
  #   depends_on:
  #     browser-env-0:
  #       condition: service_healthy
  #     browser-env-1:
  #       condition: service_healthy
